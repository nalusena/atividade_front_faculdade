<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 6</title>
</head>
<body>
    <script>
        let salario_atual, novo_salario;
        salario_atual = parseFloat(prompt("Digite o salário do funcionário"));
        novo_salario = salario_atual + (salario_atual * 25/100);
        alert("O salário atual é R$ " + salario_atual);
        alert("O salário com o aumento de 25% é R$ " + novo_salario);
    </script>
</body>
</html>
